# RocketEbpf server 配置示例（YAML，支持注释）
# 用法：
#   rocket-ebpf server --config configs/server.example.yaml --check
#   cp configs/server.example.yaml /tmp/rocket-ebpf-server.yaml
#   sudo rocket-ebpf server --config /tmp/rocket-ebpf-server.yaml

server:
  web:
    # 是否启动 Web UI / SSE 服务
    enabled: true
    # 监听地址；当前实现主要读取端口部分
    listen: "0.0.0.0:8080"

outputs:
  console:
    enabled: true
  log:
    enabled: false
    path: /tmp/rocket-ebpf-events.jsonl
  web:
    enabled: true

monitors:
  # 调度延迟：目标进程线程「唤醒 → 运行」超过 threshold_ms 时输出（支持小数，如 0.001 表示 1 微秒）
  - type: sched_latency
    name: target-sched-latency
    enabled: true
    pid: 75275
    threshold_ms: 0
    task_refresh_secs: 2
    include_prev: true
    outputs: [web]

  # 函数延迟：uprobe + uretprobe，按 interval_secs 周期聚合
  - type: func_latency
    name: malloc-latency
    enabled: false
    library: /usr/lib/x86_64-linux-gnu/libc.so.6
    symbol: malloc
    cxx: false
    pid: 75275
    interval_secs: 1
    thresholds:
      interval_avg_ns: 1000000
      interval_max_ns: 5000000
    outputs: [web]

  # 函数频率：统计命中次数与全局相邻命中间隔峰值
  # 可与 sched_latency / func_latency 同时启用（server 共用一份 eBPF 对象）
  - type: func_hz
    name: malloc-hz
    enabled: true
    library: /usr/lib/x86_64-linux-gnu/libc.so.6
    symbol: malloc
    cxx: true
    pid: 75275  # 改成你的测试程序 PID（线程组 leader）
    interval_secs: 1
    # thresholds 仅影响 console/log 告警；Web UI 每个周期都会收到指标
    # 不设 thresholds 时 console 也会每周期打印
    thresholds: {}
    outputs: [web]
